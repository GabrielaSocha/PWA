<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0a84ff" />
    <meta name="description" content="Progressive Web App starter" />

    <link rel="manifest" href="/manifest.json" />
      <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous"
    />
    <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin="anonymous"
    />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <title>PWA Starter</title>
</head>
<body>
    <main class="app" id="app">
        <header>
            <h1>PWA Starter</h1>
            <p>Installable, offline-capable web app scaffold.</p>
        </header>
      <div class="col-lg-7">
        <div class="card shadow-sm mb-4">
          <div class="card-body">
            <h2 class="h4 mb-3">Mapa miejsc</h2>
            <div id="map"></div>
            <p class="text-muted small mt-2 mb-0">
              Mapa korzysta z OpenStreetMap i Leaflet.js. Offline mogą być widoczne tylko wcześniej zapisane dane, a nie wszystkie kafelki mapy.
            </p>
          </div>
        </div>
        <section>
            <button id="action">Do something</button>
            <div class="status" id="status">Service worker: not registered</div>
        </section>
    </main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>
<script src="app.js"></script>
</body>
</html>
