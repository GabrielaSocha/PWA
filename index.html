<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0a84ff" />
    <meta name="description" content="Progressive Web App starter" />

    <link rel="manifest" href="/manifest.json" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <title>PWA Starter</title>
</head>
<body>
    <main class="app" id="app">
        <header>
            <h1>PWA Starter</h1>
            <p>Installable, offline-capable web app scaffold.</p>
        </header>

        <section>
            <button onclick="startCamera()">camera</button>
            <video autoplay></video>
        </section>

        <video id="video" width="320" height="240" autoplay></video>
        <canvas id="canvas" width="320" height="240" style="display:none;"></canvas>
        <button id="share-button">Share Photo</button>
    </main>

    <script src="/app.js"></script>
</body>
</html>
